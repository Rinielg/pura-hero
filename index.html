<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbefe3" />
    <meta name="description" content="Your wearables, medical history and lab results, together in one app." />
    <title>Pura — Your health, simplified.</title>

    <!-- The `Favicon` frame from the Figma file, exported at every size it is
         actually asked for. `.ico` carries 16, 32 and 48 in one file, which
         covers legacy browsers and the Windows taskbar; the `.svg` is what
         modern browsers pick, and it stays sharp at any size.

         `apple-touch-icon` is FLATTENED onto the brand cream on purpose. iOS
         does not honour transparency there — it composites onto black — so the
         circle's transparent corners would ship as black ones. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Figtree stands in for Greycliff CF where the brand face is not
         installed; Noto Sans is what the design actually specifies for the
         button, the scroll cue and the body of the legal documents — 700 is
         there for the bold runs inside those. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Noto+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="preload" as="fetch" href="/models/iphone-18-pro.glb" crossorigin />
    <link rel="preload" as="image" href="/assets/pura-screen.jpg" />
    <link rel="preload" as="image" href="/assets/hand.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
